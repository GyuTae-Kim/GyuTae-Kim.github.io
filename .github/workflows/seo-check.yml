name: SEO validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:content-dates
      - run: npm run update:content-dates -- --at 2026-10-16T09:16:26Z
      - uses: actions/upload-artifact@v4
        with:
          name: content-dates-bootstrap
          path: src/app/content-history.json
      - run: npm run build
      - run: npm run check:seo
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-pages
          path: docs
          include-hidden-files: true
