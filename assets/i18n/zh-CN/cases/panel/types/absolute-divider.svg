<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">绝对分规的位置</title>
<desc id="description">位置示意图：所选板件为蓝色，周围板件为灰色。</desc>
<rect width="420" height="300" fill="#f6f8fa" />
<g font-family="Arial, sans-serif" fill="#29343d">
<text x="210" y="29" text-anchor="middle" font-size="19" font-weight="bold">保持与基准面的距离</text>
<text x="82.5" y="63" text-anchor="middle" font-size="13">宽度修改前</text>
<rect x="20" y="83" width="125" height="126" fill="#edf1f5" stroke="#a5b4c3" stroke-width="2" />
<rect x="67" y="83" width="6" height="126" fill="#2c659d" />
<path d="M20,225v10 M20,230H70 M70,225v10" fill="none" stroke="#2c659d" stroke-width="1.5" />
<text x="45.0" y="255" text-anchor="middle" font-size="13" fill="#204c77">固定</text><text x="300.0" y="63" text-anchor="middle" font-size="13">宽度增加后</text>
<rect x="205" y="83" width="190" height="126" fill="#edf1f5" stroke="#a5b4c3" stroke-width="2" />
<rect x="252" y="83" width="6" height="126" fill="#2c659d" />
<path d="M205,225v10 M205,230H255 M255,225v10" fill="none" stroke="#2c659d" stroke-width="1.5" />
<text x="230.0" y="255" text-anchor="middle" font-size="13" fill="#204c77">固定</text>
<path d="M158,145h32m-7,-6 7,6-7,6" fill="none" stroke="#687785" stroke-width="2" />
<text x="210" y="285" text-anchor="middle" font-size="12" fill="#687785">正面宽度变化示意 · 省略板厚</text>
</g></svg>