<div class="page-shell interior-page">
  <div class="page-intro">
    <h1>{{ '전체 페이지' | t }}</h1>
    <p>{{ '포트폴리오와 OpenCAD의 모든 안내를 현재 선택한 언어로 찾습니다. 파일을 바로 열려면 아래의 공개 앱을 선택하세요.' | t }}</p>
  </div>
  <div class="directory-groups">
    <section *ngFor="let group of groups">
      <h2>{{ group.title | t }}</h2>
      <ul><li *ngFor="let page of group.pages"><a [routerLink]="page.path | localLink">{{ page.title | t }}</a></li></ul>
    </section>
    <section>
      <h2>{{ '브라우저에서 바로 쓰는 무료 CAD·뷰어' | t }}</h2>
      <ul><li *ngFor="let app of apps"><a [href]="app.url! | localLink">{{ app.name | t }}</a></li></ul>
    </section>
  </div>
</div>
