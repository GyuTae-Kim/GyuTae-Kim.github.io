<figure class="viewer" [attr.data-model]="model">
  <div class="viewer-bar">
    <div class="viewer-models" *ngIf="fixedModel; else modelTabs">
      <span class="viewer-model-name"
        ><span class="sheet-no">{{ info.sheet }}</span>{{ info.label }}</span
      >
    </div>
    <ng-template #modelTabs>
    <div class="viewer-models" role="group" aria-label="모델 선택">
      <button
        *ngFor="let m of models"
        type="button"
        (click)="selectModel(m.id)"
        [class.selected]="model === m.id"
        [attr.aria-pressed]="model === m.id"
      >
        <span class="sheet-no">{{ m.sheet }}</span>{{ m.label }}
      </button>
    </div>
    </ng-template>
    <span class="viewer-tag">개념 모델</span>
  </div>
  <div class="viewer-frame">
    <div
      class="viewer-stage"
      #stage
      role="img"
      [attr.aria-label]="stageLabel"
      [class.live]="state === 'live'"
    >
      <img
        class="viewer-still"
        *ngIf="state !== 'live'"
        [src]="still"
        alt=""
        width="1200"
        height="750"
      />
    </div>
    <span class="viewer-hint" *ngIf="state === 'live'" aria-hidden="true"
      ><app-icon name="orbit"></app-icon>드래그해서 돌려 보기</span
    >
    <button
      class="viewer-reset"
      type="button"
      *ngIf="state === 'live'"
      (click)="resetView()"
    >
      <app-icon name="reset"></app-icon>처음 시점
    </button>
    <button
      class="viewer-pause"
      type="button"
      *ngIf="state === 'live' && !reducedMotion"
      [attr.aria-pressed]="paused"
      (click)="togglePause()"
    >
      <app-icon [name]="paused ? 'play' : 'pause'"></app-icon
      >{{ paused ? "재생" : "정지" }}
    </button>
  </div>
  <div class="viewer-layers" role="group" aria-label="단계 선택">
    <button
      *ngFor="let l of info.layers; let i = index"
      type="button"
      (click)="selectLayer(i)"
      [class.selected]="layer === i"
      [attr.aria-pressed]="layer === i"
    >
      <b>0{{ i + 1 }}</b>{{ l.label }}
    </button>
  </div>
  <div class="viewer-body">
    <div
      class="viewer-text"
      [attr.aria-live]="autoplay && !paused ? 'off' : 'polite'"
    >
      <strong>{{ view.title }}</strong>
      <p>{{ view.text }}</p>
      <a class="text-link" *ngIf="!fixedModel" [routerLink]="['/portfolio', info.caseId]"
        >이 흐름의 실제 프로젝트<app-icon name="arrow-right"></app-icon></a
      >
    </div>
    <div class="viewer-side">
      <ol class="viewer-legend" *ngIf="view.legend.length">
        <li
          *ngFor="let item of view.legend; let i = index"
          [class.active]="view.steps && i === step"
          [class.ahead]="view.steps && step >= 0 && i > step"
        >
          <b
            class="legend-no"
            *ngIf="(view.balloons || view.steps) && !$any(item).dashed"
            >{{
            i + 1
          }}</b
          ><i
            class="legend-swatch"
            [class.dashed]="$any(item).dashed"
            [style.--swatch]="item.swatch"
          ></i
          ><span class="legend-label">{{ item.label }}</span
          ><span class="legend-detail" *ngIf="item.detail">{{
            item.detail
          }}</span>
        </li>
      </ol>
    </div>
  </div>
  <dl class="title-block">
    <div>
      <dt>도면</dt>
      <dd>{{ info.sheet }}</dd>
    </div>
    <div>
      <dt>이름</dt>
      <dd>{{ info.name }}</dd>
    </div>
    <div>
      <dt>단계</dt>
      <dd>0{{ layer + 1 }} {{ view.label }}</dd>
    </div>
    <div>
      <dt>단위</dt>
      <dd>mm</dd>
    </div>
    <div>
      <dt>작성</dt>
      <dd>김규태</dd>
    </div>
    <div>
      <dt>갱신</dt>
      <dd>{{ updated }}</dd>
    </div>
  </dl>
</figure>
