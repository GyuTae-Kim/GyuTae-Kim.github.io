<figure class="viewer" [attr.data-model]="model">
  <div class="viewer-bar">
    <div class="viewer-models" *ngIf="fixedModel; else modelTabs">
      <span class="viewer-model-name"
        ><span class="sheet-no">{{ (info.sheet) | t }}</span>{{ (info.label) | t }}</span
      >
    </div>
    <ng-template #modelTabs>
    <div class="viewer-models" role="group" [attr.aria-label]="'모델 선택' | t">
      <button
        *ngFor="let m of models"
        type="button"
        (click)="selectModel(m.id)"
        [class.selected]="model === m.id"
        [attr.aria-pressed]="model === m.id"
      >
        <span class="sheet-no">{{ (m.sheet) | t }}</span>{{ (m.label) | t }}</button>
    </div>
    </ng-template>
    <span class="viewer-tag">{{ '개념 모델' | t }}</span>
  </div>
  <div class="viewer-frame">
    <div
      class="viewer-stage"
      #stage
      role="img"
      [attr.aria-label]="(stageLabel) | t"
      [class.live]="state === 'live'"
    >
      <img
        class="viewer-still"
        *ngIf="state !== 'live'"
        [src]="still"
        alt=""
        width="1200"
        height="750"
      />
    </div>
    <span class="viewer-hint" *ngIf="state === 'live'" aria-hidden="true"
      ><app-icon name="orbit"></app-icon>{{ '드래그해서 돌려 보기' | t }}</span
    >
    <button
      class="viewer-reset"
      type="button"
      *ngIf="state === 'live'"
      (click)="resetView()"
    >
      <app-icon name="reset"></app-icon>{{ '처음 시점' | t }}
    </button>
    <button
      class="viewer-pause"
      type="button"
      *ngIf="state === 'live' && !reducedMotion"
      [attr.aria-pressed]="paused"
      (click)="togglePause()"
    >
      <app-icon [name]="paused ? 'play' : 'pause'"></app-icon
      >{{ (paused ? "재생" : "정지") | t }}</button>
  </div>
  <div class="viewer-layers" role="group" [attr.aria-label]="'단계 선택' | t">
    <button
      *ngFor="let l of info.layers; let i = index"
      type="button"
      (click)="selectLayer(i)"
      [class.selected]="layer === i"
      [attr.aria-pressed]="layer === i"
    >
      <b>{{ '0{0}' | t:[(i + 1)] }}</b>{{ (l.label) | t }}</button>
  </div>
  <div class="viewer-body">
    <div
      class="viewer-text"
      [attr.aria-live]="autoplay && !paused ? 'off' : 'polite'"
    >
      <strong>{{ (view.title) | t }}</strong>
      <p>{{ (view.text) | t }}</p>
      <a class="text-link" *ngIf="!fixedModel" [routerLink]="(['/portfolio', info.caseId]) | localLink"
        >{{ '이 흐름의 실제 프로젝트' | t }}<app-icon name="arrow-right"></app-icon></a
      >
    </div>
    <div class="viewer-side">
      <ol class="viewer-legend" *ngIf="view.legend.length">
        <li
          *ngFor="let item of view.legend; let i = index"
          [class.active]="view.steps && i === step"
          [class.ahead]="view.steps && step >= 0 && i > step"
        >
          <b
            class="legend-no"
            *ngIf="(view.balloons || view.steps) && !$any(item).dashed"
            >{{ (i + 1) | t }}</b
          ><i
            class="legend-swatch"
            [class.dashed]="$any(item).dashed"
            [style.--swatch]="item.swatch"
          ></i
          ><span class="legend-label">{{ (item.label) | t }}</span
          ><span class="legend-detail" *ngIf="item.detail">{{ (item.detail) | t }}</span>
        </li>
      </ol>
    </div>
  </div>
  <dl class="title-block">
    <div>
      <dt>{{ '도면' | t }}</dt>
      <dd>{{ (info.sheet) | t }}</dd>
    </div>
    <div>
      <dt>{{ '이름' | t }}</dt>
      <dd>{{ (info.name) | t }}</dd>
    </div>
    <div>
      <dt>{{ '단계' | t }}</dt>
      <dd>{{ '0{0} {1}' | t:[(layer + 1), (view.label)] }}</dd>
    </div>
    <div>
      <dt>{{ '단위' | t }}</dt>
      <dd>mm</dd>
    </div>
    <div>
      <dt>{{ '작성' | t }}</dt>
      <dd>{{ '김규태' | t }}</dd>
    </div>
    <div>
      <dt>{{ '갱신' | t }}</dt>
      <dd>{{ (updated) | t }}</dd>
    </div>
  </dl>
</figure>
