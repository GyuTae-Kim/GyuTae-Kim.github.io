    <link rel="manifest" href="/site.webmanifest?v=2" />
    <script>
      // 404.html sends a deep link here as /#/path; restore the path before the router starts.
      (function () {
        var hash = window.location.hash;
        if (hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', hash.slice(1));
        }
      })();
    </script>

    />
